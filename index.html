<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Мой день</title></head><body><div class="app"><main class="shell">
<section id="today" class="screen active"><header><div><small id="date"></small><h1>Мой день</h1></div><button class="circle" onclick="show('calendar')">▦</button></header><div class="hero"><div><small>Прогресс сегодня</small><strong id="pct">0%</strong><span id="summary">Добавьте первую задачу</span></div><div class="ring" id="ring"><b id="ringPct">0%</b></div></div><div class="quick"><button onclick="openNew('task')">＋ Задача</button><button onclick="openNew('habit')">＋ Привычка</button></div><div class="head"><h2>Задачи</h2><small id="taskCount"></small></div><div id="tasks"></div><div class="head habits-head"><h2>Привычки</h2><button onclick="sortHabits()">Сортировать</button></div><div id="habits"></div></section>
<section id="calendar" class="screen"><header><div><small>Планирование</small><h1>Календарь</h1></div><button class="circle" onclick="show('today')">×</button></header><div class="monthbar"><button class="circle" onclick="shift(-1)">‹</button><b id="month"></b><button class="circle" onclick="shift(1)">›</button></div><div id="cal" class="cal"></div><div id="day" class="panel"></div></section>
<section id="stats" class="screen"><header><div><small>Аналитика</small><h1>Статистика</h1></div></header><div class="stats"><div><small>Сегодня</small><b id="sp">0%</b><i id="sb"></i></div><div><small>Месяц</small><b id="mp">0%</b><i id="mb"></i></div></div><div class="panel"><h3>Выполнение по дням</h3><div id="chart" class="chart"></div></div><div class="panel"><h3>Привычки</h3><div id="hs"></div></div></section>
<section id="settings" class="screen"><header><div><small>Настройки</small><h1>Профиль</h1></div></header><div class="panel"><div class="setting"><b>Мой день</b><span>Задачи и привычки</span></div><div class="setting"><b>Данные</b><span>Сохраняются в браузере</span></div><button class="danger" onclick="resetAll()">Сбросить всё</button></div></section>
</main><nav><button class="active" data-s="today" onclick="show('today')">⌂<small>Сегодня</small></button><button data-s="calendar" onclick="show('calendar')">▦<small>Календарь</small></button><button data-s="stats" onclick="show('stats')">◒<small>Статистика</small></button><button data-s="settings" onclick="show('settings')">⚙<small>Настройки</small></button></nav></div>
<div id="modal" class="modal"><div class="sheet"><div class="sheettop"><div><small id="modalType">НОВОЕ</small><h2 id="modalTitle">Добавить задачу</h2></div><button class="circle" onclick="closeModal()">×</button></div><div class="switch"><button id="taskType" onclick="setType('task')">Задача</button><button id="habitType" onclick="setType('habit')">Привычка</button></div><label>Название<input id="name" maxlength="80" placeholder="Например, Купить продукты"></label><div class="two"><label>Дата<input id="due" type="date"></label><label>Время<input id="time" type="time"></label></div><label>Иконка<select id="icon"><option>✓</option><option>🛒</option><option>📚</option><option>🏃</option><option>💧</option><option>🕌</option><option>📖</option><option>💼</option><option>🏠</option><option>❤️</option><option>🎯</option></select></label><div id="priority" class="priority"><span>Приоритет</span><button data-p="low">Низкий</button><button data-p="medium" class="on">Средний</button><button data-p="high">Высокий</button></div><div class="actions"><button onclick="closeModal()">Отмена</button><button class="primary" onclick="saveItem()">Сохранить</button></div><button id="del" class="delete" onclick="deleteItem()">Удалить</button></div></div><div id="toast"></div><script src="app.js"></script></body></html>
